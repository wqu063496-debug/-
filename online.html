<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ミステリー・タウン｜オンラインロビー</title><style>
body{margin:0;background:linear-gradient(#172b47,#090f1c);color:#f2e5c8;font:16px system-ui,sans-serif;min-height:100vh}main{max-width:900px;margin:35px auto;padding:22px}section{background:#1c2b42;border:1px solid #9a7b4e;border-radius:16px;padding:22px;margin:15px 0}h1,h2{color:#f4cc83}input,button{font:inherit;border-radius:9px;padding:12px;margin:5px}button{background:#efc574;border:0;color:#19243a;font-weight:bold;cursor:pointer}button:disabled{opacity:.4}input{background:#111e32;color:white;border:1px solid #6d8299}#status{white-space:pre-wrap;color:#bfe2ff}.hidden{display:none}.player{border-bottom:1px solid #536177;padding:10px}.muted{color:#b6c5d9}.action{display:inline-block;margin:5px}.tile{background:#253b58;padding:9px;border-radius:8px;margin:4px;display:inline-block}.mine{border:2px solid #f6cc7e}#log{max-height:200px;overflow:auto}</style></head><body><main><h1>🔎 ミステリー・タウン ONLINE</h1><p><a href="index.html" style="color:#f5d493">← ローカル版に戻る</a></p><section id="lobby"><h2>オンライン対戦ロビー</h2><label>探偵名 <input id="name" maxlength="20" value="探偵"></label><p><button id="create">6桁ルームを作成</button></p><label>ルーム番号 <input id="code" maxlength="6" inputmode="numeric" placeholder="123456"></label><button id="join">入室</button><p id="status">Firebase設定の読み込み待ち…</p><div id="members"></div><p><button id="addBot" disabled>🤖 BOTを1人追加</button><button id="removeBot" disabled>BOTを1人削除</button></p><p class="muted">ホストがBOTを追加できます。合計4人で開始。満員の場合はホストがBOTを削除してから参加者を入室させてください。</p><button id="start" disabled>4枠そろったら開始</button></section><section id="game" class="hidden"><h2 id="gameTitle">事件捜査</h2><p id="turn"></p><div id="players"></div><div id="actions"></div><div id="tiles"></div><h3>捜査ログ</h3><div id="log"></div><h3>自分の探偵メモ</h3><pre id="notes"></pre></section></main><script src="engine.js"></script><script type="module" src="online.js"></script></body></html>
